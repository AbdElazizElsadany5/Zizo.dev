<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dark Glass Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Outer Rim Neon Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Core 'A' Monogram Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Outer Disc (Transparent outside) -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Ring -->
  <circle cx="64" cy="64" r="58.5" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Inner Subtle Accent Circuit Ring -->
  <circle cx="64" cy="64" r="51" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="4 6" />

  <!-- Center Monogram: Futuristic Geometric 'A' -->
  <!-- Left Leg -->
  <polygon points="64,28 54,28 32,96 46,96 58,60 64,46" fill="url(#glyphGrad)" filter="url(#softGlow)" />

  <!-- Right Leg -->
  <polygon points="64,28 74,28 96,96 82,96 70,60 64,46" fill="url(#glyphGrad)" filter="url(#softGlow)" />

  <!-- High-Tech Floating Horizontal Crossbar -->
  <polygon points="48,70 80,70 77,78 51,78" fill="#ffffff" fill-opacity="0.95" filter="url(#softGlow)" />

  <!-- Center Apex Cyber Node -->
  <circle cx="64" cy="51" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
</svg>